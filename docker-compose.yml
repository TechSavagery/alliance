version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: alliance-postgres
    environment:
      POSTGRES_DB: alliance
      POSTGRES_USER: alliance_user
      POSTGRES_PASSWORD: alliance_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - alliance-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alliance_user -d alliance"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis for session storage and caching
  redis:
    image: redis:7-alpine
    container_name: alliance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - alliance-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Game Server (Colyseus)
  game-server:
    build:
      context: ./game-server
      dockerfile: Dockerfile
    container_name: alliance-game-server
    ports:
      - "2567:2567"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://alliance_user:alliance_password@postgres:5432/alliance
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - PORT=2567
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - alliance-network
    volumes:
      - ./game-server:/app
      - /app/node_modules
    command: npm start

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: alliance-frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_SERVER_URL=http://localhost:2567
      - NEXT_PUBLIC_WS_URL=ws://localhost:2567
    depends_on:
      - game-server
    networks:
      - alliance-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: alliance-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/ssl/certs
    depends_on:
      - frontend
      - game-server
    networks:
      - alliance-network

volumes:
  postgres_data:
  redis_data:

networks:
  alliance-network:
    driver: bridge